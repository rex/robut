project_doc_fallback_filenames = [
    "AGENTS.md",
    "CLAUDE.md",
    "README.md",
]
nested_agents_md = true
default_model = "sonnet"

[tools]
allowed = [
    "read",
    "write",
    "edit",
    "grep",
    "glob",
    "fd",
    "bash",
]

[mcp_servers.sequential-thinking]
command = "npx"
args = [
    "-y",
    "@modelcontextprotocol/server-sequential-thinking",
]
